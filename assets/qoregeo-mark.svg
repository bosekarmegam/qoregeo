<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="QOREgeo logo">
  <title>QOREgeo</title>
  <defs>
    <linearGradient id="markBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141826"/>
      <stop offset="100%" stop-color="#0B0D14"/>
    </linearGradient>
    <linearGradient id="markAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E5B8"/>
      <stop offset="100%" stop-color="#00A88C"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#markBg)"/>
  <rect x="0.75" y="0.75" width="126.5" height="126.5" rx="27.25" fill="none"
        stroke="#00D4AA" stroke-opacity="0.28" stroke-width="1.5"/>

  <!-- Graticule: the globe reduced to the lines that define it -->
  <g fill="none" stroke="#00D4AA" stroke-opacity="0.30" stroke-width="2">
    <circle cx="64" cy="62" r="34"/>
    <ellipse cx="64" cy="62" rx="14" ry="34"/>
    <path d="M32 50h64M32 74h64"/>
  </g>

  <!-- The located point -->
  <circle cx="64" cy="62" r="17" fill="#00D4AA" fill-opacity="0.14"/>
  <circle cx="64" cy="62" r="7.5" fill="url(#markAccent)"/>
  <circle cx="64" cy="62" r="7.5" fill="none" stroke="#0B0D14" stroke-width="2"/>
</svg>
