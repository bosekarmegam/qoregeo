<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="QOREgeo, spatial intelligence for Python, zero dependencies">
  <title>QOREgeo</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10141F"/>
      <stop offset="55%" stop-color="#0B0D14"/>
      <stop offset="100%" stop-color="#0A1A18"/>
    </linearGradient>
    <linearGradient id="wordAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5B8"/>
      <stop offset="100%" stop-color="#00B894"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00D4AA" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#00D4AA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00D4AA" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <ellipse cx="980" cy="150" rx="290" ry="200" fill="url(#glow)"/>

  <!-- Wordmark -->
  <text x="72" y="132" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif"
        font-size="70" font-weight="700" letter-spacing="-1.5" fill="#FFFFFF">QORE<tspan fill="url(#wordAccent)">geo</tspan></text>

  <text x="75" y="176" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif"
        font-size="23" fill="#A6ADC0" letter-spacing="0.2">Spatial intelligence for Python. Zero dependencies.</text>

  <!-- Fact chips -->
  <g font-family="'DejaVu Sans Mono','SF Mono',Menlo,monospace" font-size="14.5">
    <g>
      <rect x="74" y="206" width="152" height="34" rx="17" fill="#00D4AA" fill-opacity="0.11" stroke="#00D4AA" stroke-opacity="0.42"/>
      <text x="150" y="228" fill="#00E5B8" text-anchor="middle">no GDAL</text>
    </g>
    <g>
      <rect x="238" y="206" width="176" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <text x="326" y="228" fill="#C9D0DE" text-anchor="middle">pure Python</text>
    </g>
    <g>
      <rect x="426" y="206" width="150" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <text x="501" y="228" fill="#C9D0DE" text-anchor="middle">Python 3.8+</text>
    </g>
  </g>

  <!-- Map motif: points, a route and a buffer -->
  <g transform="translate(880 150)">
    <g fill="none" stroke="#00D4AA" stroke-opacity="0.22" stroke-width="1.6">
      <circle r="112"/>
      <ellipse rx="46" ry="112"/>
      <path d="M-112 -46H112M-112 46H112"/>
    </g>
    <circle r="62" fill="none" stroke="#00D4AA" stroke-opacity="0.45" stroke-width="1.6" stroke-dasharray="5 6"/>
    <path d="M-74 42 L-18 -30 L38 8 L86 -54" fill="none" stroke="#00D4AA" stroke-opacity="0.55" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#00E5B8">
      <circle cx="-74" cy="42" r="7"/>
      <circle cx="-18" cy="-30" r="7"/>
      <circle cx="38" cy="8" r="7"/>
      <circle cx="86" cy="-54" r="7"/>
    </g>
    <g fill="none" stroke="#0B0D14" stroke-width="2.2">
      <circle cx="-74" cy="42" r="7"/>
      <circle cx="-18" cy="-30" r="7"/>
      <circle cx="38" cy="8" r="7"/>
      <circle cx="86" cy="-54" r="7"/>
    </g>
  </g>
</svg>
