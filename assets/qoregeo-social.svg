<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="QOREgeo, spatial intelligence for Python with zero dependencies">
  <title>QOREgeo. Spatial intelligence for Python. Zero dependencies.</title>
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121724"/>
      <stop offset="52%" stop-color="#0B0D14"/>
      <stop offset="100%" stop-color="#08191A"/>
    </linearGradient>
    <linearGradient id="swordAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5B8"/>
      <stop offset="100%" stop-color="#00B894"/>
    </linearGradient>
    <radialGradient id="sglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00D4AA" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00D4AA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="sgrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#00D4AA" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#sbg)"/>
  <rect width="1280" height="640" fill="url(#sgrid)"/>
  <ellipse cx="1010" cy="320" rx="360" ry="300" fill="url(#sglow)"/>
  <rect x="0" y="0" width="1280" height="5" fill="url(#swordAccent)"/>

  <!-- Logo mark -->
  <g transform="translate(88 74)">
    <rect width="76" height="76" rx="18" fill="#0F1420" stroke="#00D4AA" stroke-opacity="0.35" stroke-width="1.5"/>
    <g transform="translate(38 38)">
      <g fill="none" stroke="#00D4AA" stroke-opacity="0.32" stroke-width="1.6">
        <circle r="21"/>
        <ellipse rx="8.5" ry="21"/>
        <path d="M-21 -7.5H21M-21 7.5H21"/>
      </g>
      <circle r="10.5" fill="#00D4AA" fill-opacity="0.16"/>
      <circle r="5" fill="#00E5B8"/>
    </g>
  </g>

  <text x="182" y="126" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif"
        font-size="56" font-weight="700" letter-spacing="-1" fill="#FFFFFF">QORE<tspan fill="url(#swordAccent)">geo</tspan></text>

  <!-- Headline -->
  <text x="88" y="248" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif"
        font-size="60" font-weight="700" letter-spacing="-1.4" fill="#FFFFFF">Real GIS in Python.</text>
  <text x="88" y="322" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif"
        font-size="60" font-weight="700" letter-spacing="-1.4" fill="url(#swordAccent)">Nothing to compile.</text>

  <text x="90" y="378" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif"
        font-size="25" fill="#9AA3B8">Shapefiles, clustering, spatial joins, routing and maps -</text>
  <text x="90" y="414" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif"
        font-size="25" fill="#9AA3B8">pure Python, zero dependencies, installs everywhere.</text>

  <!-- Install line -->
  <g transform="translate(88 452)">
    <rect width="440" height="60" rx="12" fill="#000000" fill-opacity="0.45" stroke="#00D4AA" stroke-opacity="0.30"/>
    <text x="26" y="38" font-family="'DejaVu Sans Mono','SF Mono',Menlo,monospace" font-size="22" fill="#5C6478">$</text>
    <text x="52" y="38" font-family="'DejaVu Sans Mono','SF Mono',Menlo,monospace" font-size="22" fill="#E6EAF2">pip install qoregeo</text>
  </g>

  <!-- Fact chips -->
  <g font-family="'DejaVu Sans Mono','SF Mono',Menlo,monospace" font-size="17">
    <g>
      <rect x="88" y="546" width="150" height="40" rx="20" fill="#00D4AA" fill-opacity="0.12" stroke="#00D4AA" stroke-opacity="0.45"/>
      <text x="163" y="572" fill="#00E5B8" text-anchor="middle">no GDAL</text>
    </g>
    <g>
      <rect x="252" y="546" width="196" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <text x="350" y="572" fill="#C9D0DE" text-anchor="middle">0 dependencies</text>
    </g>
    <g>
      <rect x="462" y="546" width="176" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <text x="550" y="572" fill="#C9D0DE" text-anchor="middle">Python 3.8+</text>
    </g>
    <g>
      <rect x="652" y="546" width="150" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <text x="727" y="572" fill="#C9D0DE" text-anchor="middle">MIT</text>
    </g>
  </g>

  <!-- Map motif -->
  <g transform="translate(1000 320)">
    <g fill="none" stroke="#00D4AA" stroke-opacity="0.20" stroke-width="1.8">
      <circle r="182"/>
      <ellipse rx="74" ry="182"/>
      <path d="M-182 -74H182M-182 0H182M-182 74H182"/>
    </g>
    <circle r="104" fill="none" stroke="#00D4AA" stroke-opacity="0.42" stroke-width="1.8" stroke-dasharray="6 8"/>
    <circle r="104" fill="#00D4AA" fill-opacity="0.045"/>
    <path d="M-122 72 L-34 -48 L54 16 L138 -92" fill="none" stroke="#00D4AA" stroke-opacity="0.6"
          stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#00E5B8">
      <circle cx="-122" cy="72" r="10"/>
      <circle cx="-34" cy="-48" r="10"/>
      <circle cx="54" cy="16" r="10"/>
      <circle cx="138" cy="-92" r="10"/>
    </g>
    <g fill="none" stroke="#0B0D14" stroke-width="2.6">
      <circle cx="-122" cy="72" r="10"/>
      <circle cx="-34" cy="-48" r="10"/>
      <circle cx="54" cy="16" r="10"/>
      <circle cx="138" cy="-92" r="10"/>
    </g>
  </g>
</svg>
