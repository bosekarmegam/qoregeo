name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  checks:
    name: Lint, type-check and full test matrix
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  build:
    name: Build and test distributions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Check the release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(python -c "exec(open('qoregeo/_version.py').read()); print(__version__)")
          echo "tag=${TAG} version=${VERSION}"
          if [ "${TAG#v}" != "${VERSION}" ]; then
            echo "::error::Release tag '${TAG}' does not match qoregeo/_version.py (${VERSION})"
            exit 1
          fi
          # The plugin, Gemini extension and MCP Registry manifests carry the version too.
          python - "$VERSION" <<'PY'
          import json, sys
          version, bad = sys.argv[1], []
          for path, keys in [(".claude-plugin/plugin.json", [["version"]]),
                             ("gemini-extension.json", [["version"]]),
                             ("server.json", [["version"], ["packages", 0, "version"]])]:
              doc = json.load(open(path, encoding="utf-8"))
              for key in keys:
                  value = doc
                  for k in key:
                      value = value[k]
                  if value != version:
                      bad.append(f"{path} {key} = {value!r}")
          if bad:
              sys.exit("::error::version mismatch with qoregeo/_version.py: " + "; ".join(bad))
          PY

      - name: Build package
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
          # The Agent Skill must ship inside the wheel (`qoregeo skill install`).
          python -m zipfile -l dist/*.whl | grep -q "qoregeo/_skill/qoregeo/SKILL.md"

      - name: Test the built wheel
        run: |
          python -m pip install pytest dist/*.whl
          pytest tests/ -q -p no:cacheprovider --import-mode=importlib

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [checks, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/qoregeo

    permissions:
      # This is required for trusted publishing
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true

  mcp-registry:
    name: List the release in the MCP Registry
    needs: publish
    runs-on: ubuntu-latest
    # The PyPI release is already out; a registry hiccup shouldn't mark it failed.
    continue-on-error: true
    permissions:
      contents: read
      id-token: write   # GitHub OIDC login to the registry (io.github.bosekarmegam/*)

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Wait until PyPI serves the new version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          for i in $(seq 1 30); do
            curl -fsS "https://pypi.org/pypi/qoregeo/${TAG#v}/json" > /dev/null && exit 0
            sleep 20
          done
          echo "::error::qoregeo ${TAG#v} did not appear on PyPI"
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Publish server.json
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
